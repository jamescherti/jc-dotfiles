# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "D",   # pydocstyle
  "PTH", # flake8-use-pathlib
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific rules
  "PL",  # Pylint rules
  "A",   # flake8-builtins
  "S",   # flake8-bandit
  "RET", # flake8-return
  "TRY", # tryceratops
  "PT",  # flake8-pytest-style
  "TCH", # flake8-type-checking
]

# select = [...]  # See the Default Rules page for the full listing.
#
# The Ruff formatter intentionally conflicts with rule ISC001 (Implicit String
# Concatenation). While you don't currently have the ISC rule class enabled in
# your select list, explicitly ignoring ISC001 is standard practice to prevent
# terminal warnings and format loops if you ever expand your rule set.
ignore = [
  "ISC001", # Conflicts with Ruff formatter
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Prevent automatic removal of unused imports and variables during active development
#
# If you leave unfixable = [], running ruff check --fix (or formatting on save
# in your editor) will aggressively delete imports and variables that you are
# currently writing but haven't used yet. Uncommenting this prevents the
# auto-fixer from destroying your work-in-progress code while debugging.
unfixable = [
  "F401",
  "F841",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[\\p{XID_Continue}]*[\\p{XID_Continue}--_]+?))$"

[lint.pydocstyle]
# Enforce PEP 257 compliance for modules, classes, and functions.
convention = "pep257"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
