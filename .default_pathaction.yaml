options:
  shell_path: /bin/bash
  timeout: 600
  confirm_after_timeout: 15

  debug: false
  verbose: true

actions:
  - path_match:
      - "*/setup.py"
      - "*/pyproject.toml"
    tags:
      - main
      - install
    command: "pip install {{ file | quote }}"

  - mimetype_match:
      - "image/*"
      - "video/*"
    timeout: 0  # No timeout for the image editor
    tags:
      - main
    command:
      - "xdg-open"
      - "{{ file }}"

  - path_match: "*"
    tags: main
    cwd: "{{ file | dirname }}"
    shell: true
    command: 'source ~/.bashrc && {{ file | shebang }} {{ file | quote }}'
